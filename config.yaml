marker_detector:
  ros__parameters:
    calibration: true    # true: /image_rect; false: /image_raw
    marker_size_m: 0.1402  # size in meters of detected marker square (excluding surrounding paper)
    preprocessing: true    # tuned AprilTag detector settings (see __detector)
    bb_show: true          # true: publish /marker_bb_image with bounding boxes
    bb_colour: true        # true: boxes on the colour image; false: grey
    use_compressed: true   # true: read <image topic>/compressed (much faster over Wi-Fi)
    use_tf: true           # true: camera -> base_link from TF; false: hand-written pan-tilt geometry

# Only used by launch/two_cameras.launch.py (both cameras + fusion)
marker_detector_oak:
  ros__parameters:
    image_topic: /oak/rgb/image_raw          # OAK-D Lite RGB, 1280x720
    camera_info_topic: /oak/rgb/camera_info
    detections_topic: /detected_markers_oak
    bb_image_topic: /marker_bb_image_oak
    calibration: false     # undistort on the Mac with the OAK's own factory calibration (K, D)
    marker_size_m: 0.1402  # keep equal to marker_detector
    preprocessing: true
    bb_show: true
    bb_colour: true
    use_compressed: true
    use_tf: true           # required for the OAK (the pan-tilt geometry does not apply)

marker_fusion:
  ros__parameters:
    input_topics: [/detected_markers_pt, /detected_markers_oak]
    input_weights: [1.0, 1.0]   # trust per camera; raise one if it proves more accurate
    output_topic: /detected_markers
    max_age_s: 0.3              # ignore a camera whose last list is older (detectors publish every frame)
    disagree_warn_m: 0.3        # warn when the cameras place the same marker this far apart

localization:
  ros__parameters:
    marker_map: >
      {
      "tag36h11:0": [-0.751,  0.000],
      "tag36h11:1": [-1.529, -2.912],
      "tag36h11:2": [-1.514,  3.019],
      "tag36h11:3": [ 1.528, -2.912],
      "tag36h11:4": [ 1.514,  3.019],
      "tag36h11:5": [ 4.512,  0.000],

      "tagStandard41h12:0": [-0.751,  0.000],
      "tagStandard41h12:1": [-1.529, -2.912],
      "tagStandard41h12:2": [-1.514,  3.019],
      "tagStandard41h12:3": [ 1.528, -2.912],
      "tagStandard41h12:4": [ 1.514,  3.019],
      "tagStandard41h12:5": [ 4.512,  0.000]
      }
    min_bearing_sin: 0.05   # [0, 1]; reject nearly collinear bearing geometry
    distance_sigma_m: 0.15  # > 0; expected distance error, metres
    bearing_sigma_rad: 0.10 # > 0; expected bearing error, radians
    command_timeout_s: 0.5  # > 0; stop extrapolating an old velocity command
    camera_auto: true
    camera_max_distance_m: 4.0 # > 0; experimentally verified usable detection range
    camera_fov_deg: 120.0     # (0, 180); usable horizontal FOV, allowing for tag edges
    camera_tilt_deg: 0.0      # approximately [-30, 90]; fixed vertical tilt
    camera_cmd_topic: /ugv/pt_cmd # merged into /ugv/joint_states by joint_state_publisher (source_list)
    calib_sweep: true         # start-up pan sweep to find the start pose from every marker around
    calib_pan_deg: [-144.0, -72.0, 0.0, 72.0, 144.0]  # floats only; 72 deg steps < camera_fov_deg = overlap
    calib_settle_s: 0.8       # s; ignore detections right after each pan command (servo + detector lag)
    calib_dwell_s: 1.5        # s; time at each pan angle (settle included)
    
    odom_topic: /odom
    imu_topic: /imu/data_raw
    calib_time: 3.0         # s; rover must stand still while the gyro bias is estimated
    odom_max_age: 0.5       # s; odom/imu older than this = lost, pose not published
    # EKF (state x, y, heading). distance_sigma_m / bearing_sigma_rad above are the measurement noise R.
    odom_noise_frac: 0.10     # std of travelled distance as a fraction of it (wheel slip)
    pos_process_sigma: 0.03   # m/sqrt(s); slow position diffusion
    gyro_noise_sigma: 0.02    # rad/sqrt(s); heading random walk
    gyro_scale_noise_frac: 0.05 # std of a measured rotation as a fraction of it (gyro scale error)
    init_pos_sigma: 0.15      # m; uncertainty right after a triangulation anchor
    init_heading_sigma: 0.15  # rad
    gate_chi2: 9.21           # per-marker Mahalanobis^2 gate (chi2 2 dof, 99%)
    max_rejects: 5            # frames with all markers gated out -> re-anchor by triangulation

    # Lidar scan matching: the scan is aligned to the red barriers + marker boxes (field_map.py)
    # and corrects the EKF. Calibrate the mount with tools/calibrate_lidar.py.
    lidar_enabled: true
    barrier_segments: '[[[2.392,-3.549],[-0.708,-3.542]],[[-1.396,-3.56],[-3.764,-3.629]],[[4.071,3.19],[2.068,3.326]],[[1.386,3.42],[-0.26,3.514]],[[-0.74,3.526],[-1.3,3.563]],[[1.3,3.438],[1.025,3.457]],[[0.485,3.415],[-0.403,3.428]],[[-0.665,3.48],[-0.941,3.49]],[[-2.121,3.499],[-3.437,3.49]],[[-3.643,3.508],[-3.927,3.513]],[[4.404,-3.777],[3.728,-3.729]],[[3.366,-3.757],[2.491,-3.658]],[[-0.076,-3.522],[-0.937,-3.512]],[[4.853,2.275],[4.868,1.179]],[[4.952,-2.638],[4.971,-3.318]],[[-5.177,3.502],[-5.181,1.711]],[[-5.1,-1.702],[-5.118,-2.97]],[[1.213,3.452],[-0.009,3.537]],[[-0.669,3.519],[-2.323,3.545]],[[2.573,-3.607],[1.921,-3.558]],[[-2.09,-3.534],[-2.483,-3.556]],[[-4.174,-3.554],[-4.651,-3.476]],[[4.627,-2.196],[4.709,-1.666]],[[5.45,2.61],[5.468,2.984]],[[1.715,3.174],[2.092,3.189]],[[3.119,3.222],[3.57,3.193]],[[4.356,3.225],[4.748,3.186]],[[4.901,-3.215],[4.223,-3.244]],[[-2.561,-3.632],[-3.766,-3.651]],[[3.399,-3.818],[2.612,-3.739]],[[4.871,-3.363],[4.886,-2.675]],[[4.742,2.829],[4.7,3.105]],[[-1.275,-3.126],[-0.927,-3.117]],[[-4.702,-2.973],[-4.73,-3.431]],[[4.897,2.009],[4.906,1.573]],[[2.679,-3.653],[2.413,-3.617]],[[-0.864,-3.208],[-1.255,-3.152]],[[4.767,-1.942],[4.637,-1.554]],[[-3.639,3.464],[-3.256,3.461]],[[3.45,3.289],[3.972,3.251]],[[4.677,2.85],[4.987,2.823]],[[5.445,3.139],[5.44,2.837]],[[-5.137,2.901],[-5.13,2.491]],[[-0.871,-3.246],[-1.245,-3.197]],[[-5.143,-2.954],[-5.146,-2.692]],[[-5.206,1.722],[-5.203,2.089]],[[3.605,-3.331],[3.308,-3.343]]]'   # measured by tools/map_barriers.py
    scan_topic: /scan
    robot_frame: base_link
    lidar_rate_hz: 5.0        # scan matches per second
    lidar_use_tf: true        # mount = TF base_link <- scan frame + offsets; false = offsets only
    lidar_yaw_offset_deg: 0.0
    lidar_x_offset_m: 0.0
    lidar_y_offset_m: 0.0
    lidar_height_m: 0.165     # measured: beam height above the floor (barrier faces slope in above 0.144 m)
    lidar_min_range: 0.15     # m
    lidar_max_range: 6.0      # m
    lidar_min_inliers: 40     # points within 10 cm of the map to accept a match
    lidar_max_rms: 0.08       # m
    lidar_cov_inflate: 8.0    # scan points are correlated: inflate the ICP covariance
    lidar_gate_chi2: 11.34    # chi2 3 dof 99 %
    lidar_max_omega: 0.6      # rad/s; skip scans while turning faster
    lidar_triang_weight: 10.0 # scan fit weight when choosing among triangulation candidates
    lidar_max_gated: 5        # good lidar matches gated out in a row -> EKF reset to the lidar pose
    lidar_reanchor: false     # experimental: re-find the pose from the scan alone when lost
    lidar_max_rejects: 10


detection_node:
  ros__parameters:
    safe_distance: 1.0      # m
    danger_zone_factor: 1.2 # objects within safe_distance * danger_zone_factor are processed
    hist_fov_deg: 120.0     # < 360; total coverage 120 = -60 to +60 degrees
    bin_width_deg: 5.0      # angular width of each bin; must divide hist_fov_deg

agent:
  ros__parameters:
    # avoidance (from robot_vision_obstacle_avoidance)
    safe_distance: 0.5      # m
    half_width: 0.2         # m
    fov_deg: 30.0           # front cone half-width
    side_start_deg: 10.0
    side_limit_deg: 45.0
    v_max: 0.5              # m/s
    v_slow: 0.2             # m/s
    v_turn: 0.1             # m/s, 0 = turn in place
    omega_max: 0.5          # rad/s
    theta_avoid_deg: 30.0   # was 45; smaller = shallower turn, hugs obstacle closer
    theta_tol_deg: 5.0
    e_min: 0.4              # m
    pass_min: 0.5           # m
    clear_ticks: 3
    near_dist: 1.5
    ramp: 1.0
    k_theta: 1.5
    rate: 10.0              # Hz

    # goal
    pose_topic: /field_pose
    goal_name: penalty_mark   # penalty_mark | goal_corner_right | goal_corner_left | penalty_corner_right | penalty_corner_left
    # goal_x: 3.168           # optional: explicit duck position, overrides goal_name (set both)
    # goal_y: 0.00
    stop_dist: 0.15           # m; stop this far from the duck
    goal_slow_dist: 0.8       # m; drive at v_slow closer than this
    goal_ignore_radius: 0.35  # m; lidar points this close to the goal are the duck, not an obstacle
    pose_max_age: 0.5         # s; stop the rover if /field_pose is older
