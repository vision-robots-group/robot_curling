marker_detector:
  ros__parameters:
    calibration: true    # true: /image_rect; false: /image_raw
    marker_size_m: 0.1402  # size in meters of detected marker square (excluding surrounding paper)
    preprocessing: true    # tuned AprilTag detector settings (see __detector)
    bb_show: true          # true: publish /marker_bb_image with bounding boxes
    bb_colour: true        # true: boxes on the colour image; false: grey
    use_compressed: true   # true: read <image topic>/compressed (much faster over Wi-Fi)

localization:
  ros__parameters:
    marker_map: {
      "tag36h11:0": [-0.725,  0.000],
      "tag36h11:1": [-1.495, -3.000],
      "tag36h11:2": [-1.475,  3.000],
      "tag36h11:3": [ 1.560, -3.000],
      "tag36h11:4": [ 1.545,  3.000],
      "tag36h11:5": [ 4.500,  0.000],

      "tagStandard41h12:0": [-0.725,  0.000],
      "tagStandard41h12:1": [-1.495, -3.000],
      "tagStandard41h12:2": [-1.475,  3.000],
      "tagStandard41h12:3": [ 1.560, -3.000],
      "tagStandard41h12:4": [ 1.545,  3.000],
      "tagStandard41h12:5": [ 4.500,  0.000]
    }
    min_bearing_sin: 0.05   # [0, 1]; reject nearly collinear bearing geometry
    distance_sigma_m: 0.15  # > 0; expected distance error, metres
    bearing_sigma_rad: 0.10 # > 0; expected bearing error, radians
    command_timeout_s: 0.5  # > 0; stop extrapolating an old velocity command